[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
zip = "8.6.0"
base64 = "0.23.1"
unrar = "0.5.8"
walkdir = "2.5.0"
image = "0.25.10"
tauri-plugin-opener = "2.7.0"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "multipart", "json"] }
futures-util = "0.3.34"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-27"] }
ndarray = "0.17.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["progressbar", "onig"] }
oauth2 = "4.4.2"
tiny_http = "0.12.0"
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
tokio = { version = "1.38", features = ["rt", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
