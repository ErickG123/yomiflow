<section
  class="pomodoro-card mb-4"
  [class.pomodoro-card-collapsed]="isCollapsed()"
  [attr.aria-label]="'pomodoro.title' | transloco"
>
  @if (!isCollapsed()) {
    <div class="flex items-center justify-between mb-3">
      <span class="text-xs font-semibold text-zinc-200">{{ 'pomodoro.title' | transloco }}</span>
      <span class="text-[10px] uppercase tracking-wide text-indigo-300">{{
        'pomodoro.phases.' + phase() | transloco
      }}</span>
    </div>
    <div class="timer">{{ timeDisplay }}</div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <label class="setting-label"
        >{{ 'pomodoro.focus' | transloco }}
        <select
          class="setting-select"
          [ngModel]="focusMinutes()"
          [disabled]="status() === 'running'"
          (ngModelChange)="updateFocusMinutes(+$event)"
        >
          <option [ngValue]="25">25</option>
          <option [ngValue]="50">50</option>
        </select>
      </label>
      <label class="setting-label"
        >{{ 'pomodoro.break' | transloco }}
        <select
          class="setting-select"
          [ngModel]="breakMinutes()"
          [disabled]="status() === 'running'"
          (ngModelChange)="updateBreakMinutes(+$event)"
        >
          <option [ngValue]="5">5</option>
          <option [ngValue]="10">10</option>
        </select>
      </label>
    </div>
    <label class="setting-label block mt-2"
      >{{ 'pomodoro.category' | transloco }}
      <select
        class="setting-select w-full"
        [ngModel]="category()"
        [disabled]="status() === 'running'"
        (ngModelChange)="category.set($event)"
      >
        <option value="active_reading">
          {{ 'pomodoro.categories.active_reading' | transloco }}
        </option>
        <option value="passive_listening">
          {{ 'pomodoro.categories.passive_listening' | transloco }}
        </option>
        <option value="srs_review">{{ 'pomodoro.categories.srs_review' | transloco }}</option>
      </select>
    </label>
    <div class="flex gap-2 mt-3">
      @if (status() === 'running') {
        <button type="button" class="action-button grow" (click)="pause()">
          {{ 'pomodoro.pause' | transloco }}
        </button>
      } @else {
        <button type="button" class="action-button grow" (click)="start()">
          {{ (status() === 'paused' ? 'pomodoro.resume' : 'pomodoro.start') | transloco }}
        </button>
      }
      <button
        type="button"
        class="reset-button"
        [attr.aria-label]="'pomodoro.reset' | transloco"
        (click)="reset()"
      >
        <i class="pi pi-refresh"></i>
      </button>
    </div>
  } @else {
    <button
      type="button"
      class="flex flex-col items-center justify-center gap-2 w-full text-zinc-200"
      [attr.aria-label]="'pomodoro.title' | transloco"
      (click)="status() === 'running' ? pause() : start()"
    >
      <i class="pi pi-clock text-lg text-indigo-300"></i>
      <span class="text-xs font-semibold tabular-nums">{{ timeDisplay }}</span>
    </button>
  }
</section>
