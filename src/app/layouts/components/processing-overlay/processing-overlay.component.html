<!-- Global Processing Overlay -->
@if (appState.isProcessing()) {
  <div
    class="fixed inset-0 z-[9999] bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center animate-fadeIn select-none"
  >
    <div
      class="bg-zinc-900/90 border border-zinc-800 rounded-2xl p-8 flex flex-col items-center max-w-sm w-full mx-4 shadow-2xl text-center space-y-4"
    >
      <i class="pi pi-spin pi-spinner text-4xl text-indigo-500"></i>
      <p class="text-zinc-200 text-lg font-medium tracking-wide">
        {{ appState.progressMessage() }}
      </p>
    </div>
  </div>
}
